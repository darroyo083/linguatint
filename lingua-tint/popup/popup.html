<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaTint</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>LinguaTint</h1>

    <section class="section">
      <label class="toggle-row">
        <span class="toggle-label">Habilitado</span>
        <label class="switch">
          <input type="checkbox" id="enabled">
          <span class="slider"></span>
        </label>
      </label>
    </section>

    <section class="section">
      <h2>Ámbito</h2>
      <label class="radio-row">
        <input type="radio" name="siteMode" value="notebooklm">
        <span>Solo NotebookLM</span>
      </label>
      <label class="radio-row">
        <input type="radio" name="siteMode" value="all">
        <span>Todas las webs</span>
      </label>
    </section>

    <section class="section">
      <h2>Idiomas y colores</h2>

      <div class="color-row">
        <span class="lang-tag lang-de">DE</span>
        <span class="lang-name">Alemán</span>
        <label class="switch">
          <input type="checkbox" id="germanEnabled">
          <span class="slider"></span>
        </label>
        <input type="color" id="germanColor" class="color-picker">
      </div>

      <div class="color-row">
        <span class="lang-tag lang-es">ES</span>
        <span class="lang-name">Español</span>
        <label class="switch">
          <input type="checkbox" id="spanishEnabled">
          <span class="slider"></span>
        </label>
        <input type="color" id="spanishColor" class="color-picker">
      </div>

      <div class="preview">
        <span class="preview-de">der Hund</span>
        <span class="preview-sep"> — </span>
        <span class="preview-es">el perro</span>
      </div>
    </section>

    <section class="section" id="pronunciation-section">
      <h2>Pronunciación alemana</h2>
      <label class="toggle-row">
        <span class="toggle-label">Traducción</span>
        <label class="switch">
          <input type="checkbox" id="translationEnabled">
          <span class="slider"></span>
        </label>
      </label>
      <label class="toggle-row" style="margin-top:8px">
        <span class="toggle-label">Pronunciación</span>
        <label class="switch">
          <input type="checkbox" id="pronunciationEnabled">
          <span class="slider"></span>
        </label>
      </label>

      <div class="pron-row">
        <span class="pron-label">Voz</span>
        <select id="pronunciationVoice" class="pron-select" disabled>
          <option value="">Cargando...</option>
        </select>
      </div>

      <div class="pron-row">
        <span class="pron-label">Velocidad</span>
        <div class="pron-speed">
          <label class="speed-radio">
            <input type="radio" name="pronRate" value="0.5">
            <span>0.5</span>
          </label>
          <label class="speed-radio">
            <input type="radio" name="pronRate" value="0.8">
            <span>0.8</span>
          </label>
          <label class="speed-radio">
            <input type="radio" name="pronRate" value="1.0">
            <span>1.0</span>
          </label>
        </div>
      </div>

      <button id="pronunciationTest" class="pron-test" disabled>
        ▶ Escuchar
      </button>
    </section>

    <section class="section" id="translation-section">
      <h2>Traducción alemán → español</h2>
      <div id="translationStatus" class="trans-status">
        <div class="trans-status-icon" id="translationIcon"></div>
        <div class="trans-status-info">
          <div class="trans-status-title" id="translationTitle">Comprobando...</div>
          <div class="trans-status-detail" id="translationDetail"></div>
          <div class="trans-progress-bar" id="translationProgress">
            <div class="trans-progress-fill" id="translationProgressFill"></div>
          </div>
        </div>
      </div>
      <button id="translationAction" class="pron-test trans-action" style="display:none">Descargar modelo</button>
    </section>
  </div>
  <script src="../content/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
